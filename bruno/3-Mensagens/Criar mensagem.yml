info:
  name: Criar mensagem
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/mensagens"
  body:
    type: json
    data: |-
      {
        "texto": "Uma mensagem sobre uma boa leitura"
      }
  auth:
    type: bearer
    token: "{{tokenAdmin}}"

runtime:
  scripts:
    - type: before-request
      code: bru.deleteVar("mensagemCriadaId");
    - type: after-response
      code: |-
        if (res.getStatus() === 201 && res.getBody().id) {
          bru.setVar("mensagemCriadaId", res.getBody().id);
        }
    - type: tests
      code: |-
        test("deve retornar status 201", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("deve conter o texto enviado", function() {
          expect(res.getBody().texto).to.equal('Uma mensagem sobre uma boa leitura');
        });

        test("deve retornar id gerado", function() {
          expect(res.getBody()).to.have.property('id');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
