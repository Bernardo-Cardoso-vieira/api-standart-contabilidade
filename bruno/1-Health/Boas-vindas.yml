info:
  name: Boas-vindas
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar a mensagem de boas-vindas", function() {
          expect(res.getBody().mensagem).to.contain('Standart Contabilidade API');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
