info:
  name: Login Admin
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@biblioteca.com",
        "senha": "admin123"
      }

runtime:
  scripts:
    - type: before-request
      code: bru.deleteVar("tokenAdmin");
    - type: after-response
      code: |-
        if (res.getBody().token) {
          bru.setVar("tokenAdmin", res.getBody().token);
        }
    - type: tests
      code: |-
        test("deve retornar 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar um token", function() {
          expect(res.getBody()).to.have.property('token');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
