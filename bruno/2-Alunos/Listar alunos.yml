info:
  name: Listar usuários
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/usuarios"

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar um array", function() {
          expect(res.getBody()).to.be.an('array');
        });

        test("nenhum usuário deve conter senhaHash", function() {
          const usuarios = res.getBody();
          usuarios.forEach(usuario => {
            expect(usuario).to.not.have.property('senhaHash');
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
